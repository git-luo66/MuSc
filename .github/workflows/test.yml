name: MuSc 测试套件

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: 设置Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: 安装系统依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libglib2.0-0
    
    - name: 缓存pip依赖
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python run_tests.py --install-deps
    
    - name: 运行代码风格检查
      run: |
        pip install flake8 black isort
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check --diff .
        isort --check-only --diff .
    
    - name: 运行单元测试
      run: |
        python run_tests.py --unit --verbose --coverage
    
    - name: 运行集成测试
      run: |
        python run_tests.py --integration --verbose
    
    - name: 运行端到端测试
      run: |
        python run_tests.py --e2e --verbose
    
    - name: 上传覆盖率报告
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  test-gpu:
    runs-on: self-hosted  # 需要GPU的self-hosted runner
    if: contains(github.event.pull_request.labels.*.name, 'gpu-test')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: 设置Python环境
      run: |
        python3 -m pip install --upgrade pip
        pip install -r requirements.txt
        python run_tests.py --install-deps
    
    - name: 检查CUDA可用性
      run: |
        python -c "import torch; print(f'CUDA available: {torch.cuda.is_available()}')"
        python -c "import torch; print(f'CUDA devices: {torch.cuda.device_count()}')" || true
    
    - name: 运行GPU测试
      run: |
        python run_tests.py --gpu --verbose
    
    - name: 运行性能测试
      run: |
        python run_tests.py --performance --verbose

  test-compatibility:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: 设置Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: 3.8
    
    - name: 测试最小依赖版本
      run: |
        python -m pip install --upgrade pip
        # 安装最小版本的依赖
        pip install torch==1.12.0 torchvision==0.13.0
        pip install numpy==1.21.0 scikit-learn==1.0.0
        pip install pytest>=7.0.0
        python run_tests.py --unit --skip-slow